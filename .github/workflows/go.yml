name: go-core

# Gates the safety-critical Go core (supervision kernel, bridge session, telemetry) directly:
# a green run means the supervision core built, vetted, tested, and passed under the race
# detector. Adds to — does not replace — the Python/wheel compatibility workflow (wheels.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The authoritative gate for the supervision core. It depends ONLY on the packages that
  # own authorization behavior, so its result is unambiguous regardless of the rest of the repo.
  supervision-core:
    name: supervision-core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    env:
      CORE: >-
        ./pkg/supervise/...
        ./pkg/authz/...
        ./pkg/telemetry/...
        ./cmd/ark-bridge/...
        ./cmd/ark/...
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: Build the bridge + CLI
        run: go build ./cmd/ark-bridge ./cmd/ark
      - name: Vet the supervision core
        run: go vet $CORE
      - name: Test the supervision core
        run: go test $CORE
      - name: Race-test the supervision core
        run: go test -race $CORE

  # Broader gate: the whole module builds and its tests pass. Kept separate so a failure in an
  # unrelated package is distinguishable from a supervision-core regression above.
  full-module:
    name: full-module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: Build the whole module
        run: go build ./...
      - name: Test the whole module
        run: go test ./...
