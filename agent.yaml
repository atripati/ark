# ARK Agent Definition
# This file defines your agent's behavior, tools, and context strategy.

name: my-agent
version: "0.1"

# Model configuration (swap providers with a single line change)
model:
  provider: ollama  # anthropic | openai | ollama
  name: llama3
  max_tokens: 4096

# Context budget (ARK's killer feature)
# Instead of dumping all tool schemas into the prompt,
# ARK dynamically loads only what's relevant.
context:
  total_tokens: 200000
  strategy: adaptive  # adaptive | static | manual
  tool_budget: 10%    # vs 30-50% with raw MCP
  memory_budget: 10%
  conversation_budget: 35%
  max_steps: 5         # hard cap on agent steps per task
  timeout_seconds: 120 # wall-clock timeout (increase for slow models)

# Tools available to this agent
# Built-in: GitHub (always on), Web Search (needs BRAVE_API_KEY), File System (always on)
#
# Custom HTTP tools — connect ARK to any API:
tools:
  # Example: Weather API
  # - name: get_weather
  #   type: http
  #   method: GET
  #   uri: "https://api.openweathermap.org/data/2.5/weather?q={city}&appid=${OPENWEATHER_KEY}"
  #   description: "get current weather for a city"
  #   params:
  #     - city
  #
  # Example: Slack message (write operation — requires --allow-write)
  # - name: slack_post
  #   type: http
  #   method: POST
  #   uri: "https://slack.com/api/chat.postMessage"
  #   description: "post a message to a Slack channel"
  #   params:
  #     - channel
  #     - text
  #   headers:
  #     Authorization: "Bearer ${SLACK_TOKEN}"
  #   write: true
  #
  # Headers support ${ENV_VAR} interpolation for secrets.
  # Write tools are blocked unless --allow-write is passed.
  # Domains are auto-allowlisted from the URI.
  # ARK ranks, learns, and tracks cost for custom tools automatically.
    
# Memory configuration
memory:
  backend: file  # file | memory (sqlite coming soon)
  shared: false    # Enable shared memory graph for multi-agent
  path: "./ark-memory.db"

# Observability (built-in, always on)
tracing:
  enabled: true
  output: stdout   # stdout | file | otlp
