[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ark-memory"
version = "0.1.0"
description = "Persistent semantic memory for autonomous AI agents. 2 lines to infinite memory."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Abhishek Tripathi", email = "atripat6@depaul.edu"},
]
keywords = ["ai", "agents", "memory", "vector-search", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]

[project.urls]
Homepage = "https://arkruntime.com"
Repository = "https://github.com/atripati/ark"