[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ark-agent-runtime"
version = "0.1.0rc2"
description = "ARK Runtime SDK — attach ARK decision telemetry, cost attribution, and (experimental) constrained supervision around your existing agent."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Abhishek Tripathi" }]
keywords = ["ark", "agent", "llm", "telemetry", "cost", "supervision", "observability", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

# The core SDK has no runtime deps and supports Python >=3.9. Framework integrations are opt-in
# extras, imported lazily, so `import ark` never requires them.
#
# The langgraph extra needs Python >=3.10: LangChain/LangGraph 1.x (langgraph, langchain-core)
# declare requires-python >=3.10, so 3.9 is not honestly supportable for the integration. The
# python_version marker excludes the extra on 3.9 (installs nothing there) rather than letting
# pip pull an ancient, untested 0.x langgraph; core ARK on 3.9 is unaffected.
[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2; python_version >= '3.10'",
    "langchain-core>=0.3; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/atripati/ark"
Repository = "https://github.com/atripati/ark"

[tool.setuptools.packages.find]
include = ["ark*"]

# The bundled platform bridge binary ships as package data (built at release time).
[tool.setuptools.package-data]
"ark._bridge" = ["ark-bridge", "ark-bridge.exe"]
