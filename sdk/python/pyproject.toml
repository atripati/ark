[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ark-runtime-sdk"
version = "0.2.0"
description = "Python SDK for the ARK runtime (execution, decision traces, cost attribution, routing, experimental constrained supervision)."
requires-python = ">=3.9"
dependencies = []

# The core SDK has no runtime deps. Framework integrations are opt-in extras and are
# imported lazily, so `import ark` never requires them.
[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]

[tool.setuptools.packages.find]
include = ["ark*"]
